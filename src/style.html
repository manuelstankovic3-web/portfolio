<style>
  :root {
    --orange: #F26B1D;
    --orange-deep: #D9560C;
    --black: #000000;
    --white: #FFFFFF;
    --petrol: #13606B;
    --petrol-soft: #E3EFEF;
    --paper: #F5F5F3;
    --mist: #4A4A4A;
    --line: #DEDEDA;
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--white);
    color: var(--black);
    font-family: var(--body);
    font-size: 1.125rem;
    line-height: 1.6;
  }
  a { color: inherit; }
  a:focus-visible, button:focus-visible {
    outline: 3px solid var(--petrol);
    outline-offset: 3px;
    border-radius: 4px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* Header */
  .top {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 24px; padding-bottom: 24px;
  }
  .brand { font-family: var(--display); font-weight: 700; font-size: 1.15rem; text-decoration: none; }
  .brand span { color: var(--mist); font-weight: 500; }
  .top-link { font-weight: 700; text-decoration-color: var(--orange); text-decoration-thickness: 3px; text-underline-offset: 5px; }

  /* Hero */
  .hero {
    display: grid; grid-template-columns: 1.05fr 1fr; gap: 56px; align-items: center;
    padding-top: 40px; padding-bottom: 96px;
  }
  .hero h1 {
    font-family: var(--display); font-weight: 800;
    font-size: clamp(2.4rem, 5.2vw, 4.1rem);
    line-height: 1.02; letter-spacing: -0.02em;
    margin: 0 0 24px; color: var(--black);
  }
  .hero h1::after {
    content: ""; display: block; width: 88px; height: 8px; margin-top: 22px;
    background: var(--orange); border-radius: 4px;
  }
  .hero p.lead { font-size: 1.25rem; max-width: 34ch; margin: 0 0 32px; }
  .actions { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .btn {
    display: inline-block; font-family: var(--body); font-weight: 700; font-size: 1.1rem;
    padding: 16px 28px; border-radius: 999px; text-decoration: none;
    background: var(--orange); color: var(--black); border: 2px solid var(--orange);
    transition: background .15s ease;
  }
  .btn:hover { background: var(--orange-deep); border-color: var(--orange-deep); }
  .btn.ghost { background: transparent; color: var(--black); border-color: var(--black); }
  .btn.ghost:hover { background: var(--paper); }

  /* Before / after phones */
  .compare { display: flex; gap: 20px; justify-content: center; align-items: flex-end; }
  .phone {
    width: 210px; flex: 0 0 auto;
    border-radius: 30px; padding: 10px;
    background: var(--black);
    box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .5);
  }
  .screen { border-radius: 22px; overflow: hidden; height: 400px; position: relative; }
  .tag {
    display: block; text-align: center; font-family: var(--display); font-weight: 700;
    font-size: 1rem; margin: 10px 0 4px; color: #A3A3A3;
  }
  .after .tag { color: var(--orange); }

  /* Old site: tiny, desktop-only layout squeezed onto a phone */
  .old { background: #fff; font-family: "Times New Roman", serif; color: #333; }
  .old .bar { background: #6b4f3a; color: #fff; font-size: 8px; padding: 6px; letter-spacing: .02em; }
  .old .nav { font-size: 6px; padding: 4px 6px; background: #e8dcc8; color: #00e; text-decoration: underline; white-space: nowrap; overflow: hidden; }
  .old .body { padding: 6px; font-size: 6.5px; line-height: 1.35; }
  .old .img { height: 62px; background: repeating-linear-gradient(45deg, #cbbfa8 0 6px, #d8cdb8 6px 12px); margin: 6px 0; }
  .old .foot { position: absolute; bottom: 0; left: 0; right: 0; font-size: 6px; background: #e8dcc8; padding: 5px; text-align: center; }
  .old .notice { font-size: 7px; color: #a00; margin-top: 4px; }

  /* New site */
  .new { background: var(--black); color: var(--white); font-family: var(--body); display: flex; flex-direction: column; }
  .new .pic {
    height: 150px;
    background:
      radial-gradient(circle at 75% 32%, #FFB27A 0 16px, transparent 17px),
      linear-gradient(180deg, #F26B1D 0%, #F59A5A 54%, #13606B 55%, #0E4950 100%);
  }
  .new .in { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .new .name { font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1.05; }
  .new .sub { font-size: 11px; color: #CFCFCF; }
  .new .meta { font-size: 10.5px; color: #E6E6E6; margin-top: 4px; }
  .new .cta {
    margin-top: auto; background: var(--orange); color: var(--black); font-weight: 700;
    font-size: 13px; text-align: center; border-radius: 999px; padding: 10px;
  }
  .new .cta2 { border: 1.5px solid #5E5E5E; color: #fff; font-size: 12px; text-align: center; border-radius: 999px; padding: 8px; }
  .demo-note { text-align: center; font-size: .9rem; color: var(--mist); margin: 18px 0 0; }

  /* Sections */
  section.block { padding: 88px 0; }
  section.block.white { background: var(--paper); }
  h2 {
    font-family: var(--display); font-weight: 800; color: var(--black);
    font-size: clamp(1.9rem, 3.6vw, 2.75rem); line-height: 1.08; letter-spacing: -0.015em;
    margin: 0 0 16px; max-width: 22ch;
  }
  .intro { max-width: 60ch; color: var(--mist); margin: 0 0 48px; }

  /* What you get: two-column definition list */
  .gets { display: grid; grid-template-columns: 1fr 1fr; gap: 0 64px; margin: 0; }
  .gets div { border-top: 3px solid var(--black); padding: 22px 0 26px; }
  .gets dt { font-family: var(--display); font-weight: 700; font-size: 1.3rem; margin-bottom: 6px; }
  .gets dd { margin: 0; color: var(--mist); max-width: 46ch; }

  /* Process: a real sequence, so it is numbered */
  .steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; counter-reset: step; }
  .steps li { counter-increment: step; }
  .steps li::before {
    content: counter(step);
    display: grid; place-items: center;
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--orange); color: var(--black);
    font-family: var(--display); font-weight: 800; font-size: 1.3rem;
    margin-bottom: 18px;
  }
  .steps h3 { font-family: var(--display); font-weight: 700; font-size: 1.25rem; margin: 0 0 8px; }
  .steps p { margin: 0; color: var(--mist); }
  .steps a { color: var(--petrol); font-weight: 700; }

  /* Prices */
  .prices { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; }
  .price {
    border-radius: 24px; padding: 36px;
    background: var(--white); border: 2px solid var(--line);
  }
  .price.main { background: var(--black); color: var(--white); border-color: var(--black); }
  .price.main .amount { color: var(--orange); }
  .price.side { background: var(--petrol-soft); border-color: var(--petrol-soft); }
  .price.side .amount { color: var(--petrol); }
  .price h3 { font-family: var(--display); font-weight: 700; font-size: 1.3rem; margin: 0 0 12px; }
  .amount { font-family: var(--display); font-weight: 800; font-size: 3.4rem; line-height: 1; margin: 0 0 6px; }
  .amount small { font-size: 1.1rem; font-weight: 500; color: var(--white); }
  .price.side .amount small { color: var(--black); }
  .price ul { margin: 24px 0 0; padding-left: 20px; }
  .price li { margin-bottom: 6px; }
  .price.main .note { color: #CFCFCF; }
  .note { font-size: .98rem; color: var(--mist); margin: 0; }

  /* Contact */
  .contact { background: var(--black); color: var(--white); padding: 96px 0; }
  .contact h2 { color: var(--white); }
  .contact p { max-width: 52ch; color: #D6D6D6; margin: 0 0 32px; }
  .btn.ghost-light { background: transparent; color: var(--white); border-color: var(--white); }
  .btn.ghost-light:hover { background: #1F1F1F; }
  .mail { display: block; margin-top: 20px; font-size: 1.05rem; color: #D6D6D6; }

  footer { background: var(--black); color: #A3A3A3; font-size: .95rem; padding: 0 0 40px; }
  footer .wrap { border-top: 1px solid #2E2E2E; padding-top: 24px; }

  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; gap: 48px; padding-bottom: 72px; }
    .steps { grid-template-columns: 1fr 1fr; }
    .prices { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    body { font-size: 1.0625rem; }
    .gets { grid-template-columns: 1fr; }
    .steps { grid-template-columns: 1fr; }
    .phone { width: 46%; max-width: 190px; border-radius: 24px; padding: 7px; }
    .screen { height: 340px; border-radius: 18px; }
    .compare { gap: 12px; }
    section.block, .contact { padding: 64px 0; }
    .price { padding: 28px 22px; }
    .top-link { font-size: 1rem; }
    .brand span { display: none; }
    .hero { padding-top: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
